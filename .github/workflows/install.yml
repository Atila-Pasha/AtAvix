name: Installer smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install through the wizard
        env:
          DATABASE: ${{ matrix.database }}
        run: |
          set -euo pipefail
          database=1
          if [[ "$DATABASE" == postgres ]]; then database=2; fi
          printf '%s\n' "$database" 3 18080 admin 'Test-password-18080' 'Test-password-18080' | sudo ./main
          curl -fsS http://127.0.0.1:18080/healthz -o /dev/null
      - name: Create an account and check its subscription
        run: |
          set -euo pipefail
          base=http://127.0.0.1:18080
          cookie=$(mktemp)
          login() {
            curl -fsS -c "$cookie" --data 'username=admin&password=Test-password-18080' "$base/admin/login" -o /dev/null
          }
          login
          detail=$(curl -fsS -b "$cookie" -w '%{redirect_url}' -o /dev/null \
            --data-urlencode 'username=ci-user' --data-urlencode 'remark=CI Primary' \
            --data-urlencode 'quota=10' --data-urlencode 'enabled=on' "$base/admin/users")
          link=$(curl -fsS -b "$cookie" "$detail" | sed -n 's/.*id="subscription-link" readonly value="\([^"]*\)".*/\1/p')
          [[ "$link" == "$base/"* ]]
          profiles=$(curl -fsS "$link" | base64 --decode)
          [[ "$(printf '%s\n' "$profiles" | wc -l)" == 3 ]]
          [[ "$profiles" == *'#CI%20Primary%20%28Irancell%29'* && "$profiles" == *'#CI%20Primary%20%28MCI%29'* ]]
          [[ "$profiles" == *'balance.atavix.invalid:1'* && "$profiles" == *'#10%20of%2010%20GB'* ]]
          html=$(curl -fsS -H 'Accept: text/html' "$link")
          [[ "$html" == *'Import all profiles'* && "$html" == *'Copy all profiles'* ]]
          curl -fsS "$base/assets/subscription.css" -o /dev/null
          [[ "$(curl -fsS -H 'Accept: text/html' "$link?format=raw" | base64 --decode)" == "$profiles" ]]
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' "$base/balance")" == 404 ]]
          sudo ./main stop
          sudo ./main
          login
          [[ "$(curl -fsS -b "$cookie" "$detail" | sed -n 's/.*id="subscription-link" readonly value="\([^"]*\)".*/\1/p')" == "$link" ]]
          curl -fsS -b "$cookie" -o /dev/null \
            --data 'operator=Irancell&transport=ws&endpoint=' \
            --data-urlencode 'operator=MCI' --data 'transport=ws' --data-urlencode 'endpoint=https://alt.example.com' \
            "$base/admin/settings/operators"
          profiles=$(curl -fsS "$link" | base64 --decode)
          [[ "$(printf '%s\n' "$profiles" | wc -l)" == 3 ]]
          [[ "$profiles" == *'#CI%20Primary%20%28Irancell%29'* && "$profiles" == *'#CI%20Primary%20%28MCI%29'* ]]
      - name: Validate Caddy and split-domain settings
        run: |
          set -euo pipefail
          export ATAVIX_ADMIN_USERNAME=admin ATAVIX_PANEL_URL=https://panel.example.com
          export ATAVIX_SUB_URL=https://sub.example.com ATAVIX_PROXY_URL=https://sub.example.com
          export ATAVIX_SITE_ADDRESSES='panel.example.com, sub.example.com'
          export ATAVIX_PANEL_DOMAIN=panel.example.com ATAVIX_ACME_EMAIL=ops@example.com
          export ATAVIX_REALITY_PUBLIC=vpn.example.com:8443 ATAVIX_REALITY_PORT=8443
          export ATAVIX_REALITY_SNI=panel.example.com ATAVIX_REALITY_TARGET=caddy:443
          docker compose --env-file /dev/null -f compose.yaml -f compose.caddy.yaml -f compose.reality.yaml config --quiet
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e ATAVIX_SITE_ADDRESSES -e ATAVIX_PANEL_DOMAIN -e ATAVIX_ACME_EMAIL \
            caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Enable the direct listener on an existing installation
        if: matrix.database == 'sqlite'
        run: |
          set -euo pipefail
          printf '%s\n' 2 18080 https://panel.example.com https://sub.example.com yes 127.0.0.1 18443 panel.example.com 18444 | sudo ./main configure
          curl -fsS http://127.0.0.1:18080/healthz -o /dev/null
          timeout 3 bash -c '</dev/tcp/127.0.0.1/18443'
          timeout 3 bash -c '</dev/tcp/127.0.0.1/18444'
      - name: Show service logs on failure
        if: failure()
        run: timeout 5s sudo ./main logs || true
